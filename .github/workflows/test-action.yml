name: Test Action

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

jobs:
  test-setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: nightly
            
          # Windows x64
          - os: windows-latest
            toolchain: stable
          - os: windows-latest
            toolchain: nightly
            
          # macOS ARM (Apple Silicon)
          - os: macos-latest
            toolchain: stable
          - os: macos-latest
            toolchain: nightly
            
          # macOS Intel
          - os: macos-15-intel
            toolchain: stable
          - os: macos-15-intel
            toolchain: nightly

    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: ./
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Verify Installation
        shell: bash
        run: |
          echo "Verifying rustc and cargo versions..."
          rustc --version
          cargo --version
          echo "Installation verified successfully."
