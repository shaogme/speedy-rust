name: 'Speedy Rust Setup'
description: 'Fastest way to install Rust toolchains from speedy-rust mirror'
author: 'shaogme'
branding:
  icon: 'zap'
  color: 'orange'
inputs:
  toolchain:
    description: 'Rust toolchain channel (stable or nightly)'
    required: false
    default: 'stable'
  components:
    description: 'Comma-separated list of extra components to install (e.g. rustfmt, clippy, rust-src)'
    required: false
    default: ''
  repository:
    description: 'Repository to download artifacts from'
    required: false
    default: 'shaogme/speedy-rust'

runs:
  using: "composite"
  steps:
    - name: Download and Install Toolchain
      shell: bash
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_REPO: ${{ inputs.repository }}
      run: |
        set -e
        
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          OS_KEY="linux"
          EXT="tar.zst"
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          OS_KEY="windows"
          EXT="zip"
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          OS_KEY="macos"
          EXT="tar.zst"
        else
          echo "::error::Unsupported OS: $RUNNER_OS"
          exit 1
        fi
        
        # Detect Architecture
        ARCH=$(uname -m)
        if [[ "$ARCH" == "x86_64" ]]; then
          ARCH_KEY="x64"
        elif [[ "$ARCH" == "aarch64" ]] || [[ "$ARCH" == "arm64" ]]; then
          ARCH_KEY="aarch64"
        else
          echo "::error::Unsupported Architecture: $ARCH"
          exit 1
        fi
        
        echo "Detected OS: $RUNNER_OS ($OS_KEY) Arch: $ARCH ($ARCH_KEY)"
        
        # Construct URL
        FILENAME="rust-${INPUT_TOOLCHAIN}-${OS_KEY}-${ARCH_KEY}.${EXT}"
        URL="https://github.com/${INPUT_REPO}/releases/download/${INPUT_TOOLCHAIN}/${FILENAME}"
        
        # Define install path (use runner temp to avoid workspace clutter)
        INSTALL_DIR="${{ runner.temp }}/speedy-rust/${INPUT_TOOLCHAIN}"
        mkdir -p "$INSTALL_DIR"
        
        echo "Downloading toolchain from: $URL"
        
        if [[ "$OS_KEY" == "windows" ]]; then
          # Windows: Download then extract
          HTTP_CODE=$(curl -L -w "%{http_code}" -o "toolchain.zip" "$URL")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Failed to download toolchain. HTTP Code: $HTTP_CODE. URL: $URL"
            exit 1
          fi
          
          echo "Extracting to: $INSTALL_DIR"
          7z x "toolchain.zip" -o"$INSTALL_DIR" -y > /dev/null
          rm "toolchain.zip"
        else
          # Linux/macOS: Stream download and extract (zstd)
          # Use explicit zstd decompression pipe to avoid tar subprocess issues (broken pipe on macOS)
          echo "Streaming download and extraction to: $INSTALL_DIR"
          
          curl -fL "$URL" | zstd -d --stdout | tar -x -C "$INSTALL_DIR" || {
             echo "::error::Failed to download or extract toolchain. URL: $URL"
             exit 1
          }
        fi
        
            # Helper function to check components
            if [[ -n "$INPUT_COMPONENTS" ]]; then
                echo "Checking requested components: $INPUT_COMPONENTS"
                # Replace commas with spaces
                IFS=',' read -ra COMPS <<< "$INPUT_COMPONENTS"
                
                for comp in "${COMPS[@]}"; do
                    # Trim whitespace
                    comp=$(echo "$comp" | xargs)
                    if [[ "$comp" == "rustfmt" ]]; then
                        if "$INSTALL_DIR/bin/cargo-fmt" --version &> /dev/null || "$INSTALL_DIR/bin/rustfmt" --version &> /dev/null; then
                            echo "Component '$comp' is installed (pre-packaged)."
                        else
                            echo "::warning::Component '$comp' was requested but not found in the package."
                        fi
                    elif [[ "$comp" == "clippy" ]]; then
                        if "$INSTALL_DIR/bin/cargo-clippy" --version &> /dev/null; then
                            echo "Component '$comp' is installed (pre-packaged)."
                        else
                            echo "::warning::Component '$comp' was requested but not found in the package."
                        fi
                    elif [[ "$comp" == "rust-src" ]]; then
                         SRC_DIR="$INSTALL_DIR/lib/rustlib/src/rust"
                         if [[ -d "$SRC_DIR" ]]; then
                            echo "Component '$comp' is installed (pre-packaged)."
                         else
                            echo "Downloading component '$comp'..."
                            
                            # Construct source filename
                            if [[ "$OS_KEY" == "windows" ]]; then
                                SRC_FILENAME="rust-src-${INPUT_TOOLCHAIN}.zip"
                            else
                                SRC_FILENAME="rust-src-${INPUT_TOOLCHAIN}.tar.zst"
                            fi
                            
                            SRC_URL="https://github.com/${INPUT_REPO}/releases/download/${INPUT_TOOLCHAIN}/${SRC_FILENAME}"
                            
                            echo "Downloading source from: $SRC_URL"
                            
                            if [[ "$OS_KEY" == "windows" ]]; then
                                HTTP_CODE=$(curl -L -w "%{http_code}" -o "rust-src.zip" "$SRC_URL")
                                if [[ "$HTTP_CODE" != "200" ]]; then
                                    echo "::warning::Failed to download rust-src. HTTP Code: $HTTP_CODE. URL: $SRC_URL"
                                else
                                    echo "Extracting source..."
                                    7z x "rust-src.zip" -o"$INSTALL_DIR" -y > /dev/null
                                    rm "rust-src.zip"
                                fi
                            else
                                echo "Streaming download and extraction with zstd..."
                                curl -fL "$SRC_URL" | zstd -d --stdout | tar -x -C "$INSTALL_DIR" || {
                                     echo "::warning::Failed to download or extract rust-src. URL: $SRC_URL"
                                }
                            fi
                         fi
                    else
                        echo "::warning::Dynamic installation of component '$comp' is not supported for custom toolchains. Ignored."
                    fi
                done
            fi
        
        # Locate bin directory
        # We expect bin/ to be at the root of INSTALL_DIR, but if the archive has a top-level folder, we search.
        if [[ -d "$INSTALL_DIR/bin" ]]; then
           BIN_PATH="$INSTALL_DIR/bin"
        else
           # Find bin folder (depth 1 or 2)
           BIN_PATH=$(find "$INSTALL_DIR" -maxdepth 2 -name bin -type d | head -n 1)
        fi
        
        if [[ -z "$BIN_PATH" ]]; then
           echo "::error::Could not find 'bin' directory in extracted toolchain."
           find "$INSTALL_DIR" -maxdepth 2
           exit 1
        fi
        
        echo "Found bin path: $BIN_PATH"
        
        # Add to PATH
        echo "$BIN_PATH" >> $GITHUB_PATH
        
        # Export default toolchain override if needed?
        # usually not needed if PATH handles it.
        
    - name: Verify Installation
      shell: bash
      run: |
        echo "Verifying Rust installation..."
        rustc --version
        cargo --version
